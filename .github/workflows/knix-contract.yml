name: knix contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Collaboration invariants
        run: python3 scripts/verify-knix.py

      - name: Reproducibility gate
        run: python3 scripts/verify-repro.py

      - name: Run-backend contract gate
        run: python3 scripts/verify-backends.py

      # The seed qcow2 is pinned by SHA512 but lives outside the repository and
      # is never fetched in CI. build.sh --check validates it on a build host;
      # here we verify every in-repo input, the locked kernel/rootfs baseline
      # and the single-image launch rule.
      - name: Single-image, UEFI and graphics build contract
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(".")
          m = json.loads((root / "platform/image/manifest.json").read_text())
          bad = []
          checked = 0
          for group, entries in m["inputs"].items():
              if group == "seed" or not isinstance(entries, dict):
                  continue
              for rel, expected in entries.items():
                  p = root / rel
                  got = (hashlib.sha256(p.read_bytes()).hexdigest()
                         if p.is_file() else "missing")
                  checked += 1
                  if got != expected:
                      bad.append(("input drift", group, rel))
          art = m.get("artifact", {})
          if art.get("name") != "knix.img" or art.get("single") is not True:
              bad.append(("artifact", "expected exactly one knix.img"))
          b = m.get("build_baseline", {})
          if (not isinstance(b, dict) or not b.get("kernel")
                  or not b.get("rootfs")):
              bad.append(("build_baseline", "kernel/rootfs lock missing"))
          if m.get("publish_surface") != ["knix.img", "origin/main"]:
              bad.append(("publish_surface", "drifted"))
          boot = m.get("boot", {})
          if boot.get("method") != "UEFI self-boot":
              bad.append(("boot.method", "expected UEFI self-boot"))
          if "BOOTAA64.EFI" not in boot.get("esp", ""):
              bad.append(("boot.esp", "removable media path missing"))
          for stage in m.get("build_stages", []):
              rel = stage.split()[0]
              if not (root / rel).is_file():
                  bad.append(("build_stages", rel, "missing"))
          assemble = (root / "platform/image/assemble-native.sh").read_text()
          if "systemd-bootaa64.efi" not in assemble or "mkinitramfs" not in assemble:
              bad.append(("assemble-native.sh", "lost the guest-owned EFI payload"))
          if "C12A7328-F81F-11D2-BA4B-00A0C93EC93B" not in assemble:
              bad.append(("assemble-native.sh", "lost the EFI system partition type"))
          native = (root / "platform/backends/vm-virt/boot-native.sh").read_text()
          dev = (root / "platform/backends/vm-virt/boot-dev.sh").read_text()
          if 'export DISK="${DISK:-$DEV/knix.img}"' not in native:
              bad.append(("boot-native.sh", "no longer defaults to knix.img"))
          if "AAVMF_VARS-selfboot.fd" not in native:
              bad.append(("boot-native.sh", "lost the fresh EFI variable store"))
          if 'export SEED="${SEED-}"' not in native:
              bad.append(("boot-native.sh", "self-boot path must not attach a seed ISO"))
          if 'SEED="${SEED-$DEV/seed.iso}"' not in dev:
              bad.append(("boot-dev.sh", "seed ISO is no longer optional"))
          gfx = m.get("graphics", {})
          if (gfx.get("owner") != "guest"
                  or gfx.get("device") != "virtio-gpu-pci"
                  or gfx.get("compositor") != "sway"):
              bad.append(("graphics", "guest-owned virtio-gpu/sway contract missing"))
          verify_rel = gfx.get("verify", "")
          if not (root / verify_rel).is_file():
              bad.append(("graphics.verify", verify_rel, "missing"))
          else:
              v = (root / verify_rel).read_text()
              for token in ('GRAPHICS VERIFY OK', '/dev/dri/card0', 'GBM buffer',
                            'Created GL FBO', '"app_id": "foot"', 'New wlr_surface'):
                  if token not in v:
                      bad.append(("verify-graphics.sh", token, "missing"))
          kernel_recipe = (root / "platform/image/build-kernel.sh").read_text()
          for token in ("CONFIG_DRM_VIRTIO_GPU=m", "CONFIG_VIRTIO_INPUT=m",
                        "CONFIG_DRM_VIRTIO_GPU_KMS=y"):
              if token not in kernel_recipe:
                  bad.append(("build-kernel.sh", token, "missing"))
          if "knix-graphics.conf" not in assemble:
              bad.append(("assemble-native.sh", "graphics modules-load missing"))
          if "virtio-gpu-pci" not in native or "GPU_INPUT" not in native:
              bad.append(("boot-native.sh", "graphics devices not enabled"))
          for token in ('GPU="${GPU-none}"', 'GPU_INPUT="${GPU_INPUT-none}"',
                        '-display "$DISPLAY_BACKEND"'):
              if token not in dev:
                  bad.append(("boot-dev.sh", token, "missing"))
          build = (root / "platform/image/build.sh").read_text()
          if ("verify-graphics.sh" not in build
                  or "GPU=none GPU_INPUT=none" not in build):
              bad.append(("build.sh", "graphics verification is not wired in"))
          if bad:
              for b in bad:
                  print("CONTRACT DRIFT:", b, file=sys.stderr)
              sys.exit(1)
          print("CONTRACT OK: %d inputs, locked kernel/rootfs baseline, one artifact, "
                "%d build stages, UEFI self-boot + graphics" %
                (checked, len(m.get("build_stages", []))))
          PY

      - name: Shell recipes parse
        run: |
          find platform scripts -name '*.sh' -type f -print0 | xargs -0 -n 1 bash -n
          echo "SHELL OK"

      - name: Python recipes parse
        run: |
          python3 - <<'PY'
          import ast, pathlib
          for p in sorted(pathlib.Path("scripts").glob("*.py")):
              ast.parse(p.read_text(), filename=str(p))
              print("parsed", p)
          PY

      - name: Kernel config fragment resolves
        run: KNIX_KERNEL_SRC=repos/linux KNIX_KERNEL_OUT=/tmp/knix-out bash platform/image/build-kernel.sh --check

      - name: Rootfs package set resolves
        run: KNIX_IDENTITY_DIR=platform/identity bash platform/image/build-rootfs.sh --check
