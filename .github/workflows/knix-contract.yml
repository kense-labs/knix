name: knix contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Collaboration invariants
        run: python3 scripts/verify-knix.py

      - name: Reproducibility gate
        run: python3 scripts/verify-repro.py

      - name: Baseline refresh policy
        run: python3 scripts/refresh-baseline.py --self-test

      - name: Framebuffer pixel gate
        run: python3 platform/image/verify-framebuffer.py --self-test

      - name: Run-backend contract gate
        run: python3 scripts/verify-backends.py

      - name: Release verification gate
        run: python3 scripts/verify-release.py --self-test

      # The seed qcow2 is pinned by SHA512 but lives outside the repository and
      # is never fetched in CI. build.sh --check validates it on a build host;
      # here we verify every in-repo input, the locked kernel/rootfs baseline
      # and the single-image launch rule.
      - name: Single-image, UEFI and graphics build contract
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(".")
          m = json.loads((root / "platform/image/manifest.json").read_text())
          bad = []
          checked = 0
          for group, entries in m["inputs"].items():
              if group == "seed" or not isinstance(entries, dict):
                  continue
              for rel, expected in entries.items():
                  p = root / rel
                  got = (hashlib.sha256(p.read_bytes()).hexdigest()
                         if p.is_file() else "missing")
                  checked += 1
                  if got != expected:
                      bad.append(("input drift", group, rel))
          art = m.get("artifact", {})
          if art.get("name") != "knix.img" or art.get("single") is not True:
              bad.append(("artifact", "expected exactly one knix.img"))
          b = m.get("build_baseline", {})
          if (not isinstance(b, dict) or not b.get("kernel")
                  or not b.get("rootfs")):
              bad.append(("build_baseline", "kernel/rootfs lock missing"))
          if m.get("publish_surface") != ["knix.img", "origin/main"]:
              bad.append(("publish_surface", "drifted"))
          br = m.get("baseline_refresh", {})
          if (br.get("tool") != "scripts/refresh-baseline.py"
                  or br.get("require_proposal") is not True
                  or br.get("require_reason_chars") != 8
                  or br.get("fingerprints_must_match") is not True):
              bad.append(("baseline_refresh", "policy drifted"))
          refresh = (root / "scripts/refresh-baseline.py").read_text()
          for token in ("--self-test", "--propose", "--apply", "--reason",
                        "kernel_drift_is_never_refreshed"):
              if token not in refresh:
                  bad.append(("refresh-baseline.py", token, "missing"))
          rel = m.get("release", {})
          if (rel.get("tool") != "scripts/verify-release.py"
                  or rel.get("read_only") is not True
                  or rel.get("schema") != 3
                  or len(rel.get("checks", [])) != 18
                  or "diagnostics_persistence_verified" not in rel.get("checks", [])
                  or "diagnostics_operations_verified" not in rel.get("checks", [])
                  or "diagnostics_trends_verified" not in rel.get("checks", [])
                  or "login_policy_verified" not in rel.get("checks", [])
                  or rel.get("min_diagnostics_events") != 2
                  or rel.get("min_boots_seen") != 2
                  or rel.get("min_trend_boots") != 2
                  or rel.get("trend_boot_limit") != 8
                  or rel.get("trend_byte_limit") != 4096
                  or rel.get("framebuffer_samples") != 9
                  or rel.get("publish_surface") != ["knix.img", "origin/main"]):
              bad.append(("manifest.release", "acceptance policy drifted"))
          gate_path = root / "scripts/verify-release.py"
          if not gate_path.is_file():
              bad.append(("verify-release.py", "missing"))
          else:
              gate = gate_path.read_text()
              for token in ("RELEASE VERIFY OK", "RELEASE FAILED", "--self-test",
                            "receipt checksum drift", "image sha256 drift",
                            "baseline sha256 drift", "publish_surface drift",
                            "diagnostics persistence drift",
                            "diagnostics_persistence_verified",
                            "diagnostics operations drift",
                            "diagnostics_operations_verified",
                            "diagnostics trends drift",
                            "diagnostics_trends_verified"):
                  if token not in gate:
                      bad.append(("verify-release.py", token, "missing"))
          for group, entries in m["inputs"].items():
              if isinstance(entries, dict) and any(
                      "verify-release" in k for k in entries):
                  bad.append(("inputs", group, "release gate must not be pinned"))
          boot = m.get("boot", {})
          if boot.get("method") != "UEFI self-boot":
              bad.append(("boot.method", "expected UEFI self-boot"))
          if "BOOTAA64.EFI" not in boot.get("esp", ""):
              bad.append(("boot.esp", "removable media path missing"))
          for stage in m.get("build_stages", []):
              rel = stage.split()[0]
              if not (root / rel).is_file():
                  bad.append(("build_stages", rel, "missing"))
          assemble = (root / "platform/image/assemble-native.sh").read_text()
          if "systemd-bootaa64.efi" not in assemble or "mkinitramfs" not in assemble:
              bad.append(("assemble-native.sh", "lost the guest-owned EFI payload"))
          if "C12A7328-F81F-11D2-BA4B-00A0C93EC93B" not in assemble:
              bad.append(("assemble-native.sh", "lost the EFI system partition type"))
          native = (root / "platform/backends/vm-virt/boot-native.sh").read_text()
          dev = (root / "platform/backends/vm-virt/boot-dev.sh").read_text()
          if 'export DISK="${DISK:-$DEV/knix.img}"' not in native:
              bad.append(("boot-native.sh", "no longer defaults to knix.img"))
          if "AAVMF_VARS-selfboot.fd" not in native:
              bad.append(("boot-native.sh", "lost the fresh EFI variable store"))
          if 'export SEED="${SEED-}"' not in native:
              bad.append(("boot-native.sh", "self-boot path must not attach a seed ISO"))
          if 'SEED="${SEED-$DEV/seed.iso}"' not in dev:
              bad.append(("boot-dev.sh", "seed ISO is no longer optional"))
          gfx = m.get("graphics", {})
          if (gfx.get("owner") != "guest"
                  or gfx.get("device") != "virtio-gpu-pci"
                  or gfx.get("compositor") != "sway"):
              bad.append(("graphics", "guest-owned virtio-gpu/sway contract missing"))
          if (gfx.get("seat_manager") != "seatd"
                  or gfx.get("session_user") != "knix"
                  or gfx.get("backends") != ["drm", "libinput"]):
              bad.append(("graphics", "guest-owned seatd session contract missing"))
          session_doc = json.loads((root / gfx.get("session", "")).read_text())
          sp = session_doc.get("seat_provider", {})
          if (sp.get("manager") != "seatd" or sp.get("owner") != "guest"
                  or sp.get("backends") != ["drm", "libinput"]
                  or sp.get("groups") != ["video", "input", "render"]):
              bad.append(("session.json", "seat provider drifted"))
          if "known_limitation" in gfx:
              bad.append(("graphics", "stale get_inputs limitation still declared"))
          au = session_doc.get("autostart", {})
          if (au.get("enabled") is not True or au.get("owner") != "guest"
                  or au.get("target") != "multi-user.target"
                  or au.get("condition") != "/dev/dri/card0"):
              bad.append(("session.json", "autostart contract drifted"))
          if (gfx.get("autostart") is not True
                  or gfx.get("autostart_target") != "multi-user.target"
                  or gfx.get("autostart_condition") != "/dev/dri/card0"):
              bad.append(("graphics", "autostart contract drifted"))
          res = gfx.get("resilience", {})
          if (res.get("owner") != "guest" or res.get("manager") != "systemd"
                  or res.get("restart") != "on-failure"
                  or res.get("restart_sec") != 2
                  or res.get("start_limit_burst") != 5
                  or res.get("start_limit_interval_sec") != 30):
              bad.append(("graphics.resilience", "recovery contract drifted"))
          sr = session_doc.get("resilience", {})
          if (sr.get("owner") != "guest" or sr.get("restart") != "on-failure"
                  or sr.get("start_limit_burst") != 5):
              bad.append(("session.json", "resilience contract drifted"))
          fb = gfx.get("framebuffer", {})
          if (fb.get("owner") != "guest"
                  or fb.get("resolution") != [1280, 800]
                  or fb.get("samples") != 9
                  or fb.get("verify") != "platform/image/verify-framebuffer.py"
                  or "QMP screendump (P6)" not in fb.get("capture", "")):
              bad.append(("graphics.framebuffer", "guest-owned pixel contract missing"))
          fb_rel = fb.get("verify", "")
          if not (root / fb_rel).is_file():
              bad.append(("graphics.framebuffer.verify", fb_rel, "missing"))
          else:
              f = (root / fb_rel).read_text()
              for token in ("--self-test", "FRAMEBUFFER VERIFY OK",
                            "FRAMEBUFFER SELF-TEST OK", "FRAMEBUFFER PATTERN:",
                            "qmp_capabilities", "screendump", '"format": "ppm"',
                            "guest pattern", "too dark to prove a repaint"):
                  if token not in f:
                      bad.append(("verify-framebuffer.py", token, "missing"))
          cl = gfx.get("crash_loop", {})
          if (cl.get("owner") != "guest" or cl.get("manager") != "systemd"
                  or cl.get("burst") != 5 or cl.get("interval_sec") != 30
                  or cl.get("degraded_failed_units") != 1
                  or cl.get("signal") != "Start request repeated too quickly."):
              bad.append(("graphics.crash_loop", "guest-owned start-limit contract missing"))
          scl = session_doc.get("resilience", {}).get("crash_loop", {})
          if (scl.get("owner") != "guest" or scl.get("burst") != 5
                  or scl.get("interval_sec") != 30
                  or scl.get("signal") != "Start request repeated too quickly."):
              bad.append(("session.json", "crash-loop contract drifted"))
          dg = gfx.get("diagnostics", {})
          if (dg.get("owner") != "guest" or dg.get("manager") != "systemd"
                  or dg.get("unit") != "/etc/systemd/system/knix-session-failure.service"
                  or dg.get("script") != "/usr/lib/knix/session-failure-report.sh"
                  or dg.get("report") != "/run/knix/session-failure.txt"
                  or dg.get("history") != "/run/knix/session-failure.history"
                  or dg.get("min_reported_events") != 2
                  or "OnFailure=" not in dg.get("trigger", "")):
              bad.append(("graphics.diagnostics", "guest-owned crash report missing"))
          sd = session_doc.get("diagnostics", {})
          if (sd.get("owner") != "guest" or sd.get("manager") != "systemd"
                  or "OnFailure=" not in sd.get("trigger", "")
                  or sd.get("report") != "/run/knix/session-failure.txt"
                  or sd.get("history") != "/run/knix/session-failure.history"):
              bad.append(("session.json", "diagnostics contract drifted"))
          dp = dg.get("persistence", {})
          if (dp.get("owner") != "guest" or dp.get("manager") != "systemd-journald"
                  or dp.get("log") != "/var/lib/knix/session-failure.log"
                  or dp.get("snapshot") != "/var/lib/knix/session-failure.txt"
                  or dp.get("journal_storage") != "persistent"
                  or dp.get("min_reported_events") != 2
                  or dp.get("survives_reboot") is not True):
              bad.append(("graphics.diagnostics.persistence", "guest crash archive missing"))
          sp = sd.get("persistence", {})
          if (sp.get("owner") != "guest" or sp.get("manager") != "systemd-journald"
                  or sp.get("log") != "/var/lib/knix/session-failure.log"
                  or sp.get("journal_storage") != "persistent"):
              bad.append(("session.json", "diagnostics.persistence drifted"))
          pasm = (root / "platform/image/assemble-native.sh").read_text()
          for token in ("knix-persistence.conf", "Storage=persistent",
                        "PDIR=/var/lib/knix", "session-failure.log",
                        "boot=$BOOT_ID"):
              if token not in pasm:
                  bad.append(("assemble-native.sh", token, "missing"))
          pbuild = (root / "platform/image/build.sh").read_text()
          for token in ("DIAGNOSTICS PERSISTENCE VERIFY OK", "PERSISTENCE DRIFT",
                        "PERSISTENCE EVENTS:", "KNIX_KEEP_VARS=1",
                        "reboot verification", '"persistence": {'):
              if token not in pbuild:
                  bad.append(("build.sh", token, "missing"))
          pvg = (root / "platform/image/verify-graphics.sh").read_text()
          for token in ("PERSISTENCE VERIFY OK", "ARCHIVE_EVENTS",
                        "Storage=persistent", "session-failure.log"):
              if token not in pvg:
                  bad.append(("verify-graphics.sh", token, "missing"))
          # diagnostics.operations: the guest bounds and rotates its own
          # archive, keeps cross-boot statistics and raises a local err-priority
          # alert. A second boot must advance the statistics before a receipt.
          dop = dg.get("operations", {})
          if (dop.get("owner") != "guest" or dop.get("manager") != "systemd"
                  or dop.get("archive_limit_bytes") != 8192
                  or dop.get("generations") != 3
                  or dop.get("statistics") != "/var/lib/knix/session-failure.stats"
                  or dop.get("alert") != "/var/lib/knix/session-failure.alert"
                  or dop.get("journal_tag") != "knix-diagnostics"
                  or dop.get("journal_priority") != "err"
                  or dop.get("login_notice") != "/etc/profile.d/10-knix-session-alert.sh"
                  or dop.get("drill_directory") != "/run/knix/rotation-drill"
                  or dop.get("min_boots_seen") != 2):
              bad.append(("graphics.diagnostics.operations", "guest operations missing"))
          sop = sd.get("operations", {})
          if (sop.get("owner") != "guest" or sop.get("archive_limit_bytes") != 8192
                  or sop.get("generations") != 3
                  or sop.get("statistics") != "/var/lib/knix/session-failure.stats"
                  or sop.get("alert") != "/var/lib/knix/session-failure.alert"
                  or sop.get("journal_tag") != "knix-diagnostics"
                  or sop.get("journal_priority") != "err"
                  or sop.get("login_notice") != "/etc/profile.d/10-knix-session-alert.sh"
                  or sop.get("drill_directory") != "/run/knix/rotation-drill"
                  or sop.get("min_boots_seen") != 2):
              bad.append(("session.json", "diagnostics.operations drifted"))
          # Inspect the real heredocs: the same literals also appear in the
          # validation loops, so a whole-file check can be fooled.
          report = pasm.split("<<'REPORT'\n", 1)[-1].split("\nREPORT\n", 1)[0]
          for token in ("LIMIT=8192", "session-failure.stats",
                        "session-failure.rotations", "KNIX_DIAG_DRILL_DIR",
                        "systemd-cat -p err", "total_events=", "boots_seen="):
              if token not in report:
                  bad.append(("assemble-native.sh REPORT", token, "missing"))
          if "10-knix-session-alert.sh" not in pasm:
              bad.append(("assemble-native.sh", "login notice", "missing"))
          persist = pbuild.split("<<'PERSIST'", 1)[-1].split("\nPERSIST\n", 1)[0]
          for token in ("DIAGNOSTICS OPS PERSISTENCE VERIFY OK", "OPS EVENTS:",
                        "OPS BOOTS:"):
              if token not in persist:
                  bad.append(("build.sh PERSIST", token, "missing"))
          for token in ("OPS DRIFT", '"operations": {'):
              if token not in pbuild:
                  bad.append(("build.sh", token, "missing"))
          if pbuild.count('sys.exit("OPS DRIFT') < 2:
              bad.append(("build.sh receipt block", "OPS DRIFT refusal", "missing"))
          for token in ("DIAGNOSTICS OPS VERIFY OK", "ROTATION VERIFY OK",
                        "rotation-drill", "session-failure.stats",
                        "knix-diagnostics"):
              if token not in pvg:
                  bad.append(("verify-graphics.sh", token, "missing"))
          # login policy: accounts, credentials and login decisions are the
          # guest's own. sshd refuses root and every password path; logind
          # carries an explicit idle policy; no getty autologin override.
          la = gfx.get("authentication", {})
          if (la.get("owner") != "guest" or la.get("manager") != "systemd-logind"
                  or la.get("policy") != "/etc/ssh/sshd_config.d/10-knix-auth.conf"
                  or la.get("logind_policy") != "/etc/systemd/logind.conf.d/10-knix-login.conf"
                  or la.get("verify") != "platform/image/verify-login.sh"
                  or la.get("accounts") != ["knix"]
                  or la.get("root_login") is not False
                  or la.get("password_authentication") is not False
                  or la.get("public_key_authentication") is not True
                  or la.get("autologin") is not True
                  or la.get("no_getty_autologin") is not True
                  or la.get("idle_action") != "ignore"
                  or la.get("idle_action_sec") != "30min"):
              bad.append(("graphics.authentication", "guest login policy missing"))
          sau = session_doc.get("authentication", {})
          if (sau.get("owner") != "guest"
                  or session_doc.get("autologin") is not True
                  or sau.get("root_login") is not False
                  or sau.get("password_authentication") is not False
                  or sau.get("public_key_authentication") is not True
                  or sau.get("autologin") is not True
                  or sau.get("accounts") != ["knix"]
                  or sau.get("idle_action") != "ignore"
                  or sau.get("idle_action_sec") != "30min"):
              bad.append(("session.json", "authentication contract drifted"))
          plogin = (root / "platform/image/verify-login.sh").read_text()
          for token in ("LOGIN POLICY OK", "LOGIN VERIFY OK", "permitrootlogin no",
                        "authenticationmethods publickey",
                        "PreferredAuthentications=password", "root@127.0.0.1"):
              if token not in plogin:
                  bad.append(("verify-login.sh", token, "missing"))
          for token in ("10-knix-auth.conf", "10-knix-login.conf",
                        "AuthenticationMethods publickey", "passwd -l root"):
              if token not in pasm:
                  bad.append(("assemble-native.sh", token, "missing"))
          # The installed policy must live in the heredoc itself; a validation
          # grep that repeats the same literal cannot stand in for it.
          sshd = pasm.split("<<'SSHD'\n", 1)[-1].split("\nSSHD\n", 1)[0]
          logind = pasm.split("<<'LOGIND'\n", 1)[-1].split("\nLOGIND\n", 1)[0]
          if ("<<'SSHD'\n" not in pasm or "\nSSHD\n" not in pasm
                  or "<<'LOGIND'\n" not in pasm or "\nLOGIND\n" not in pasm):
              bad.append(("assemble-native.sh", "guest login heredocs", "missing"))
          sshd_lines = [line.strip() for line in sshd.splitlines()]
          logind_lines = [line.strip() for line in logind.splitlines()]
          for token in ("PermitRootLogin no", "PasswordAuthentication no",
                        "KbdInteractiveAuthentication no", "PubkeyAuthentication yes",
                        "PermitEmptyPasswords no", "AuthenticationMethods publickey"):
              if token not in sshd_lines:
                  bad.append(("assemble-native.sh SSHD", token, "missing"))
          for token in ("IdleAction=ignore", "IdleActionSec=30min"):
              if token not in logind_lines:
                  bad.append(("assemble-native.sh LOGIND", token, "missing"))
          for token in ("LOGIN POLICY OK", "LOGIN VERIFY OK", "guest-login.log",
                        '"authentication": {'):
              if token not in pbuild:
                  bad.append(("build.sh", token, "missing"))
          for token in ('> "$DEV/guest-login.log" 2>&1 || LOGIN_RC=$?',
                        'cat "$DEV/guest-login.log"',
                        "grep -q 'LOGIN POLICY OK' \"$DEV/guest-login.log\"",
                        "grep -q 'LOGIN VERIFY OK' \"$DEV/guest-login.log\"",
                        'login_log = (dev / "guest-login.log").read_text()'):
              if token not in pbuild:
                  bad.append(("build.sh login wiring", token, "missing"))
          if pbuild.count('sys.exit("LOGIN DRIFT') < 2:
              bad.append(("build.sh receipt block", "LOGIN DRIFT refusal", "missing"))
          if "login_policy_verified" not in m.get("release", {}).get("checks", []):
              bad.append(("release.checks", "login_policy_verified", "missing"))
          # diagnostics trends: the same guest OnFailure= script recomputes a
          # bounded per-boot profile from its own archive, with no host input.
          dt = gfx.get("diagnostics", {}).get("trends", {})
          expected_fields = ["events", "failed_states", "limit_events",
                            "restarts_peak", "first_seen", "last_seen"]
          if (dt.get("owner") != "guest" or dt.get("manager") != "systemd"
                  or dt.get("report") != "/var/lib/knix/session-failure.trends"
                  or dt.get("boot_limit") != 8 or dt.get("byte_limit") != 4096
                  or dt.get("per_boot_fields") != expected_fields
                  or dt.get("min_boots_seen") != 2):
              bad.append(("graphics.diagnostics.trends", "guest trend contract", "missing"))
          st = session_doc.get("diagnostics", {}).get("trends", {})
          if (st.get("owner") != "guest" or st.get("boot_limit") != 8
                  or st.get("byte_limit") != 4096
                  or st.get("per_boot_fields") != expected_fields
                  or st.get("min_boots_seen") != 2):
              bad.append(("session.json diagnostics.trends", "guest trend contract", "missing"))
          report = pasm.split("<<'REPORT'\n", 1)[-1].split("\nREPORT\n", 1)[0]
          for token in ("session-failure.trends", "TREND_BOOTS=8",
                        "TREND_LIMIT=4096", "write_trends()",
                        "trend_events_sum=", "restarts_peak=", "s/.* events="):
              if token not in report:
                  bad.append(("assemble-native.sh REPORT", token, "missing"))
          for token in ("TRENDS VERIFY OK", "TRENDS BOOTS:", "TRENDS EVENTS:",
                        "trend_boots_kept=", "s/.* events=",
                        "guest trend rows carry no events"):
              if token not in pvg:
                  bad.append(("verify-graphics.sh", token, "missing"))
          for token in ("TRENDS VERIFY OK", "DIAGNOSTICS TRENDS PERSISTENCE VERIFY OK",
                        '"trends": {', "s/.* events=",
                        "guest trend rows carry no events"):
              if token not in pbuild:
                  bad.append(("build.sh", token, "missing"))
          if pbuild.count('sys.exit("TRENDS DRIFT') < 2:
              bad.append(("build.sh receipt block", "TRENDS DRIFT refusal", "missing"))
          # The self-test also contains the drift label as an expected error;
          # require the actual refusal statement rather than a bare substring.
          if ("diagnostics_trends_verified" not in gate
                  or 'errors.append("diagnostics trends drift: guest per-boot trend report was not proven")'
                  not in gate):
              bad.append(("verify-release.py", "trends check", "missing"))
          if "diagnostics_trends_verified" not in m.get("release", {}).get("checks", []):
              bad.append(("release.checks", "diagnostics_trends_verified", "missing"))
          verify_rel = gfx.get("verify", "")
          if not (root / verify_rel).is_file():
              bad.append(("graphics.verify", verify_rel, "missing"))
          else:
              v = (root / verify_rel).read_text()
              for token in ('GRAPHICS VERIFY OK', 'SESSION VERIFY OK',
                            'AUTOSTART VERIFY OK', 'RESILIENCE VERIFY OK',
                            'systemctl kill --signal=SIGKILL',
                            'is-enabled', 'is-active',
                            'systemctl restart',
                            'multi-user.target.wants/knix-session.service',
                            'knix-session.service', 'seatd',
                            '71-knix-virtio-input.rules',
                            'QEMU Virtio Keyboard', 'QEMU Virtio Tablet',
                            '/dev/dri/card0', 'GBM buffer',
                            'Created GL FBO', '"app_id": "foot"', 'New wlr_surface'):
                  if token not in v:
                      bad.append(("verify-graphics.sh", token, "missing"))
              for token in ("FRAMEBUFFER PATTERN:", "/dev/urandom", "solid_color",
                            "FRAMEBUFFER PATTERN PAINTED", "LIMIT VERIFY OK",
                            "Start request repeated too quickly",
                            "systemctl reset-failed", "FAILED_UNITS",
                            "ssh.service", "/dev/ttyAMA0", "NRestarts",
                            "DIAGNOSTICS VERIFY OK", "DIAGNOSTICS EVENTS:",
                            "session-failure.txt", "session-failure.history",
                            "knix-session-failure.service", "OnFailure=",
                            "'failed_units=1'", 'tail -1 "$DIAG_HISTORY"',
                            '"$DIAG_EVENTS" -ge 2', "active_state=failed",
                            "is-failed"):
                  if token not in v:
                      bad.append(("verify-graphics.sh", token, "missing"))
              if 'systemctl stop "$UNIT_NAME"' in v:
                  bad.append(("verify-graphics.sh", "must not stop the boot-time session"))
          if '-qmp "unix:$QMP,server=on,wait=off"' not in dev:
              bad.append(("boot-dev.sh", "headless QMP screendump socket missing"))
          kernel_recipe = (root / "platform/image/build-kernel.sh").read_text()
          for token in ("CONFIG_DRM_VIRTIO_GPU=m", "CONFIG_VIRTIO_INPUT=m",
                        "CONFIG_DRM_VIRTIO_GPU_KMS=y"):
              if token not in kernel_recipe:
                  bad.append(("build-kernel.sh", token, "missing"))
          if "knix-graphics.conf" not in assemble:
              bad.append(("assemble-native.sh", "graphics modules-load missing"))
          for token in ("71-knix-virtio-input.rules", "knix-session.service",
                        "WLR_BACKENDS=drm,libinput", "LIBSEAT_BACKEND=seatd",
                        "sudo,video,input,render", "TAG+=\"seat\"",
                        "session-failure-report.sh", "session-failure.txt",
                        "session-failure.history", "knix-session-failure.service"):
              if token not in assemble:
                  bad.append(("assemble-native.sh", token, "missing"))
          # Check the actual unit heredoc, not just the validation loop that
          # happens to contain the same directive literals.
          unit_heredoc = assemble.split("<<'UNIT'\n", 1)[-1].split("\nUNIT\n", 1)[0]
          unit_lines = [line.strip() for line in unit_heredoc.splitlines()]
          for directive in ("Restart=on-failure", "RestartSec=2",
                            "StartLimitBurst=5", "StartLimitIntervalSec=30",
                            "OnFailure=knix-session-failure.service"):
              if directive not in unit_lines:
                  bad.append(("assemble-native.sh", "unit heredoc lost " + directive))
          if "virtio-gpu-pci" not in native or "GPU_INPUT" not in native:
              bad.append(("boot-native.sh", "graphics devices not enabled"))
          for token in ('GPU="${GPU-none}"', 'GPU_INPUT="${GPU_INPUT-none}"',
                        '-display "$DISPLAY_BACKEND"'):
              if token not in dev:
                  bad.append(("boot-dev.sh", token, "missing"))
          build = (root / "platform/image/build.sh").read_text()
          if ("verify-graphics.sh" not in build
                  or "GPU=none GPU_INPUT=none" not in build):
              bad.append(("build.sh", "graphics verification is not wired in"))
          if ("SESSION VERIFY OK" not in build
                  or "knix-session.service" not in build
                  or '"session"' not in build):
              bad.append(("build.sh", "seatd session verification is not wired in"))
          for token in ("AUTOSTART VERIFY OK", "RESILIENCE VERIFY OK",
                        "is-enabled knix-session.service",
                        "is-active knix-session.service", '"autostart"',
                        '"resilience": {', "FRAMEBUFFER VERIFY OK",
                        "verify-framebuffer.py", "framebuffer-verify.json",
                        '"framebuffer": {', "QMP=\"$DEV/qmp.sock\"",
                        "LIMIT VERIFY OK", '"crash_loop": {',
                        "DIAGNOSTICS VERIFY OK", "DIAGNOSTICS EVENTS:",
                        '"diagnostics": {', "diag_events"):
              if token not in build:
                  bad.append(("build.sh", token, "missing"))
          if "! systemctl is-enabled" in build:
              bad.append(("build.sh", "still asserts the session is disabled"))
          for token in ("ln -sf ../knix-session.service",
                        "multi-user.target.wants/knix-session.service",
                        "WantedBy=multi-user.target",
                        "systemd-udev-settle.service"):
              if token not in assemble:
                  bad.append(("assemble-native.sh", token, "missing"))
          if "session unit must stay disabled" in assemble:
              bad.append(("assemble-native.sh", "stale disabled-by-default assertion"))
          if bad:
              for b in bad:
                  print("CONTRACT DRIFT:", b, file=sys.stderr)
              sys.exit(1)
          print("CONTRACT OK: %d inputs, locked kernel/rootfs baseline, one artifact, "
                "%d build stages, UEFI self-boot + graphics + framebuffer + crash loop + diagnostics + persistence + operations + trends + login policy + release gate" %
                (checked, len(m.get("build_stages", []))))
          PY

      - name: Shell recipes parse
        run: |
          find platform scripts -name '*.sh' -type f -print0 | xargs -0 -n 1 bash -n
          echo "SHELL OK"

      - name: Python recipes parse
        run: |
          python3 - <<'PY'
          import ast, pathlib
          recipes = sorted(pathlib.Path("scripts").glob("*.py"))
          recipes += sorted(pathlib.Path("platform/image").glob("*.py"))
          for p in recipes:
              ast.parse(p.read_text(), filename=str(p))
              print("parsed", p)
          PY

      - name: Kernel config fragment resolves
        run: KNIX_KERNEL_SRC=repos/linux KNIX_KERNEL_OUT=/tmp/knix-out bash platform/image/build-kernel.sh --check

      - name: Rootfs package set resolves
        run: KNIX_IDENTITY_DIR=platform/identity bash platform/image/build-rootfs.sh --check
