# See the documentation for more information:
# https://packit.dev/docs/configuration/

specfile_path: alsa-ucm-knix.spec
files_to_sync:
  - alsa-ucm-knix.spec
  - .packit.yaml

actions:
  # Fetch the specfile from Rawhide and disable rpmautospec
  post-upstream-clone: "bash -c \"curl -s https://src.fedoraproject.org/rpms/alsa-ucm-knix/raw/main/f/alsa-ucm-knix.spec | sed -e '/^%autochangelog$/d' > alsa-ucm-knix.spec\""

srpm_build_deps:
  - bash
  - curl
  - sed

jobs:
- job: copr_build
  trigger: commit
  owner: "@knix"
  project: packit-builds
  targets:
    - fedora-all-aarch64
    - fedora-rawhide-i386
    - fedora-rawhide-ppc64le
    - fedora-rawhide-s390x
    - fedora-rawhide-x86_64

- job: copr_build
  trigger: pull_request
  owner: "@knix"
  project: packit-builds
  targets:
    - fedora-all-aarch64
    - fedora-rawhide-i386
    - fedora-rawhide-ppc64le
    - fedora-rawhide-s390x
    - fedora-rawhide-x86_64
